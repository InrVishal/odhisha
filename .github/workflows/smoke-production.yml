# On demand: the production smoke test (read-only), from a GitHub runner, for
# checking production after a change made outside CI (for example a new
# Upstash database and a redeploy from Vercel's dashboard). Label any PR
# "smoke-production" (write or triage access only). It runs main's checks,
# not the PR's: production runs main's code.
name: Smoke test (production)
on:
  pull_request:
    types: [labeled]
permissions: {}
jobs:
  smoke:
    name: Production smoke test (main's checks, read-only)
    if: github.event.label.name == 'smoke-production' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - name: Health, security headers and smoke test on production
        env:
          PROD_HOST: nightshift-ten-iota.vercel.app
        run: |
          code=$(curl -sS -o health.json -w '%{http_code}' "https://$PROD_HOST/api/health")
          echo "/api/health: HTTP $code $(head -c 60 health.json)"
          node scripts/check-headers.mjs "https://$PROD_HOST"
          node scripts/smoke.mjs "https://$PROD_HOST"
