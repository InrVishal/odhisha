# NightShift CI/CD. Stages run in the order the spec requires:
#   1 lint+typecheck → 2 unit → 3 integration → 4 security → 5 build
#   → preview deploy (own Neon branch) → 6 E2E → 7 ZAP → 8 Lighthouse
#   → production deploy (main only, and only if everything above is green)
#
# Vercel's own Git auto-deploy is turned off in vercel.json, so this pipeline
# is the only way code reaches Vercel.
#
# Required secrets (see DEPLOY.md): VERCEL_TOKEN, VERCEL_ORG_ID,
# VERCEL_PROJECT_ID, NEON_API_KEY, NEON_PROJECT_ID,
# VERCEL_AUTOMATION_BYPASS_SECRET, and in the "production" environment:
# PROD_DATABASE_URL_UNPOOLED, PROD_BASE_URL.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Dummy values so code that validates env at import time can load in CI.
  # Real secrets only ever come from Vercel at deploy time.
  AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
  CRON_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
  DATABASE_URL: pglite:memory

jobs:
  lint-typecheck:
    name: 1 · Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: 2 · Unit tests
    needs: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      # Runs unit + integration (PGlite) together so coverage on lib/ is complete.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: coverage, path: coverage/, retention-days: 7 }

  agent:
    name: 2b · Agent (ruff, mypy --strict, bandit, pytest + real-container sandbox tests)
    needs: lint-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11" }
      - name: Install (hash-pinned)
        run: |
          python -m pip install --quiet --require-hashes -r requirements-dev.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e . || python -m pip install --quiet --no-deps -e .
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: mypy --strict
        run: mypy
      - name: bandit
        run: bandit -r src -c pyproject.toml
      - name: pytest (90% coverage, includes sandbox escape tests in real containers)
        run: pytest --cov --cov-report=term-missing

  integration:
    name: 3 · Integration tests (Postgres 18)
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run test:integration

  security:
    name: 4 · Security scans
    needs: [integration, agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci

      - name: Secrets (gitleaks, full history)
        env: { GITLEAKS_VERSION: "8.30.1" }
        run: |
          # Keep the release's own filename: the checksum file refers to it.
          F="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$F" "$BASE/$F"
          curl -sSfL -o checksums.txt "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $F\$" checksums.txt | sha256sum -c -
          tar -xzf "$F" gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml .

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: OSV scanner (npm + pip lockfiles)
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --recursive
            ./

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11" }
      - name: Semgrep (fail on ERROR)
        run: |
          python -m pip install --quiet "semgrep==1.186.0"
          semgrep scan --error --severity ERROR --metrics off \
            --config p/default --config p/owasp-top-ten --config p/typescript --config p/python \
            --config .semgrep.yml \
            --exclude node_modules --exclude coverage --exclude .next

      - name: pip-audit (agent)
        if: hashFiles('agent/requirements.lock') != ''
        run: |
          python -m pip install --quiet "pip-audit==2.10.1"
          pip-audit --strict -r agent/requirements.lock
          pip-audit --strict -r agent/requirements-dev.lock

      - name: Banned words in site copy (source) and COPY.md in sync
        run: npm run copy:check -- --source-only

  build:
    name: 5 · Build
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Banned words on the built site (crawls every page)
        run: npm run copy:check
      - name: Accessibility, keyboard and site checks on the build (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: playwright-build, path: "playwright-report/\ntest-results/", retention-days: 7 }

  preview:
    name: Preview deploy (own Neon branch) + live agent test + signed-in dashboards
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci

      - name: Create Neon branch for this PR / main run
        id: neon
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ${{ github.event_name == 'pull_request' && format('preview/pr-{0}', github.event.number) || format('ci/main-{0}', github.run_id) }}

      - name: Migrate the preview database
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
        run: |
          npx --yes vercel@66.5.0 pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes vercel@66.5.0 build --token="$VERCEL_TOKEN"
          url=$(npx --yes vercel@66.5.0 deploy --prebuilt --token="$VERCEL_TOKEN" --env DATABASE_URL="$PREVIEW_DATABASE_URL" --env SYBIL_CHECKER_RULES=report)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Security headers on the preview
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/check-headers.mjs "${{ steps.deploy.outputs.url }}"

      # Runs here because it needs this run's preview database (to create
      # the test owner and buyer sessions), which can't be passed to another job.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11" }
      - name: Agent against the preview (real batch-embedding fragment, buyer downloads the result)
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PREVIEW_DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_AUTH_FILE: ${{ runner.temp }}/e2e-auth.json
        run: |
          python -m pip install --quiet --require-hashes -r agent/requirements.lock
          python -m pip install --quiet --no-deps ./agent
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          npx tsx tests/live/agent-preview.ts

      # Signed in as the owner, buyer and admin from the step above, whose job
      # really ran. No report upload: traces would hold the (1-hour) sessions.
      - name: Signed-in dashboards in a real browser (buyer, owner, admin)
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          E2E_AUTH_FILE: ${{ runner.temp }}/e2e-auth.json
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/dashboard.spec.ts --project=chromium
          rm -f "$E2E_AUTH_FILE"

  e2e:
    name: 6 · E2E against preview
    needs: preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Playwright (Chromium, Firefox, WebKit, mobile)
        if: hashFiles('playwright.config.ts') != ''
        env:
          E2E_BASE_URL: ${{ needs.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          npx playwright install --with-deps
          npm run test:e2e

  zap:
    name: 7 · OWASP ZAP baseline
    needs: [preview, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ needs.preview.outputs.url }}
          rules_file_name: .zap/rules.tsv
          # -I: only FAIL rules (high) break the build; WARNs are reported.
          cmd_options: >-
            -a -j -I
            -z "-config replacer.full_list(0).description=bypass
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=REQ_HEADER
            -config replacer.full_list(0).matchstr=x-vercel-protection-bypass
            -config replacer.full_list(0).replacement=${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"
          allow_issue_writing: false
          fail_action: true

  lighthouse:
    name: 8 · Lighthouse (90+ on every category)
    needs: [preview, zap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Lighthouse CI
        env:
          LHCI_BASE_URL: ${{ needs.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx --yes @lhci/cli@0.16.1 autorun --config=lighthouserc.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: lighthouse, path: lhci_reports/, retention-days: 14 }

  production:
    name: Production deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lighthouse]
    runs-on: ubuntu-latest
    # GitHub environment holding production-only secrets. Add required
    # reviewers to it in repo settings if you want a manual approval gate.
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci

      - name: Migrate production (see DEPLOY.md for rollback)
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL_UNPOOLED }}

      - name: Build and deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@66.5.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@66.5.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@66.5.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Security headers on production
        run: node scripts/check-headers.mjs "${{ secrets.PROD_BASE_URL }}"

      - name: Health check
        run: curl -sSf "${{ secrets.PROD_BASE_URL }}/api/health"

      - name: Lighthouse on production (includes the SEO crawlability audit)
        env:
          LHCI_BASE_URL: ${{ secrets.PROD_BASE_URL }}
          LHCI_PRODUCTION: "1"
        run: npx --yes @lhci/cli@0.16.1 autorun --config=lighthouserc.cjs

  cleanup-main-branch:
    name: Delete the main-run Neon branch
    if: always() && github.event_name == 'push'
    needs: [preview, e2e, zap, lighthouse, production]
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ci/main-${{ github.run_id }}
