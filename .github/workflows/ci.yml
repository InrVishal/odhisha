# NightShift CI/CD. Stages run in the order the spec requires:
#   1 lint+typecheck → 2 unit → 3 integration (+3b canary classifier) → 4 security
#   → 5 build → preview deploy (own Neon branch) → 6 E2E → 7 ZAP full scan
#   → 8 Lighthouse; 9 load test runs alongside the preview
#   → production deploy + smoke test (main only, and only if everything above is green)
#
# Vercel's own Git auto-deploy is turned off in vercel.json, so this pipeline
# is the only way code reaches Vercel.
#
# Secrets (see SECURITY.md, "Secrets in CI"): VERCEL_TOKEN, VERCEL_ORG_ID,
# VERCEL_PROJECT_ID, NEON_API_KEY, NEON_PROJECT_ID,
# VERCEL_AUTOMATION_BYPASS_SECRET, and in the "production" environment:
# PROD_DATABASE_URL_UNPOOLED, PROD_BASE_URL.
#
# Hardening: every job states its own permissions (the default is none);
# no pull_request_target, so a fork's code never runs with secrets; jobs that
# need secrets don't run for fork PRs at all; checkouts don't keep the token;
# workflow expressions never go straight into shell scripts (zizmor checks).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  NODE_VERSION: "22"
  # Dummy values so code that validates env at import time can load in CI.
  # Real secrets only ever come from Vercel at deploy time.
  AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
  CRON_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
  DATABASE_URL: pglite:memory

jobs:
  lint-typecheck:
    name: 1 · Lint and typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: 2 · Unit tests
    needs: lint-typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      # Runs unit + integration (PGlite, as the app_runtime role) together so coverage on lib/ is complete.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: coverage, path: coverage/, retention-days: 7 }

  agent:
    name: 2b · Agent (ruff, mypy --strict, bandit, pytest + real-container sandbox tests)
    needs: lint-typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11" }
      - name: Install (hash-pinned)
        run: |
          python -m pip install --quiet --require-hashes -r requirements-dev.lock
          python -m pip install --quiet --no-deps --no-build-isolation -e . || python -m pip install --quiet --no-deps -e .
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: mypy --strict
        run: mypy
      - name: bandit
        run: bandit -r src -c pyproject.toml
      - name: pytest (90% coverage, includes sandbox escape tests in real containers)
        run: pytest --cov --cov-report=term-missing

  integration:
    name: 3 · Integration tests (Postgres 18, as app_runtime)
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run test:integration

  canary-classifier:
    name: 3b · Canary classifier (n = 1000 per class)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      CANARY_CLASSIFIER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Can a cheater tell known-answer canaries from real work? (fails if the 95% upper bound is above 0.55)
        run: npx vitest run tests/integration/canary.test.ts -t "n = 1000"

  security:
    name: 4 · Security scans
    needs: [integration, agent]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pull the digest-pinned workload images for the container scan.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci

      - name: Secrets (gitleaks, full history)
        env: { GITLEAKS_VERSION: "8.30.1" }
        run: |
          # Keep the release's own filename: the checksum file refers to it.
          F="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$F" "$BASE/$F"
          curl -sSfL -o checksums.txt "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $F\$" checksums.txt | sha256sum -c -
          tar -xzf "$F" gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml .

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: OSV scanner (npm + pip lockfiles)
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --recursive
            ./

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11" }
      - name: Semgrep (project rules tested first, then the scan; fail on ERROR)
        run: |
          python -m pip install --quiet "semgrep==1.186.0"
          semgrep --test --metrics off tools/semgrep
          semgrep scan --error --severity ERROR --metrics off \
            --config p/default --config p/owasp-top-ten --config p/typescript --config p/python \
            --config tools/semgrep/nightshift.yaml \
            --exclude node_modules --exclude coverage --exclude .next --exclude tools/semgrep

      - name: GitHub Actions workflows (zizmor)
        run: |
          python -m pip install --quiet "zizmor==1.33.1"
          zizmor --offline .github/workflows

      - name: pip-audit (agent)
        if: hashFiles('agent/requirements.lock') != ''
        run: |
          python -m pip install --quiet "pip-audit==2.10.1"
          pip-audit --strict -r agent/requirements.lock
          pip-audit --strict -r agent/requirements-dev.lock

      - name: Container images (Trivy, every digest-pinned workload image; fail on fixable high/critical)
        env:
          TRIVY_VERSION: "0.76.1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          F="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          BASE="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sSfL -o "$F" "$BASE/$F"
          curl -sSfL -o trivy-checksums.txt "$BASE/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $F\$" trivy-checksums.txt | sha256sum -c -
          tar -xzf "$F" trivy
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          images=$(grep -oE 'ghcr\.io/[a-z0-9./-]+@sha256:[0-9a-f]{64}' lib/coordinator/workloads.ts | sort -u)
          test -n "$images"
          for img in $images; do
            echo "::group::$img"
            ./trivy image --quiet --no-progress --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln "$img"
            echo "::endgroup::"
          done

      - name: Banned words in site copy (source) and COPY.md in sync
        run: npm run copy:check -- --source-only

  build:
    name: 5 · Build
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run build
      - name: No secrets or source maps in anything a browser can download
        run: node scripts/scan-bundle.mjs
      - name: Banned words on the built site (crawls every page)
        run: npm run copy:check
      - name: Accessibility, keyboard and site checks on the build (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium
      - name: Smoke test on the build (exposed files, source maps, admin 404s, error pages)
        run: |
          NODE_ENV=production EMAIL_TRANSPORT=console RATE_LIMIT_BACKEND=memory nohup node node_modules/next/dist/bin/next start -p 3500 > smoke-server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3500/api/health >/dev/null && break; sleep 1; done
          node scripts/smoke.mjs http://127.0.0.1:3500
      # No Playwright report/trace/screenshot upload anywhere: this repo is public,
      # and traces hold page contents and cookies. Failures are read from the log.

  load:
    name: 9 · Load test (k6, 200 virtual users, p95 < 300 ms)
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run build
      - name: k6
        env: { K6_VERSION: "2.3.0" }
        run: |
          F="k6-v${K6_VERSION}-linux-amd64.tar.gz"
          BASE="https://github.com/grafana/k6/releases/download/v${K6_VERSION}"
          curl -sSfL -o "$F" "$BASE/$F"
          curl -sSfL -o k6-checksums.txt "$BASE/k6-v${K6_VERSION}-checksums.txt"
          grep " $F\$" k6-checksums.txt | sha256sum -c -
          tar -xzf "$F" --strip-components=1 "k6-v${K6_VERSION}-linux-amd64/k6"
      # Runs on this runner only: the app and its database are local. The preview
      # and production are never load-tested, so no Vercel, Neon or Upstash quota
      # is used, and per-IP limits (which Vercel's real client IP would trip,
      # since every virtual user comes from this one runner) don't skew results.
      - name: "Capacity of ONE app process (reported, not judged): 200 virtual users for 3 minutes"
        env:
          ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          echo "runner: $(nproc) vCPUs"
          bash tools/load/prepare-db.sh 200 load-seed.json
          bash tools/load/run.sh 1 k6-summary-1-process.json --no-thresholds
      - name: "Judged run, 3 app processes (like 3 Vercel instances): 200 virtual users for 3 minutes"
        env:
          ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          bash tools/load/prepare-db.sh 200 load-seed.json
          bash tools/load/run.sh 3 k6-summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: k6-summary, path: "k6-summary*.json", retention-days: 14 }

  preview:
    name: Preview deploy (own Neon branch, as app_runtime) + live agent test + signed-in dashboards
    needs: build
    # Secrets never reach a fork's code: fork PRs stop before this job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      neon_branch: ${{ github.event_name == 'pull_request' && format('preview/pr-{0}', github.event.number) || format('ci/main-{0}', github.run_id) }}
      neon_branch_id: ${{ steps.neon.outputs.branch_id }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci

      - name: Create Neon branch for this PR / main run
        id: neon
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ${{ github.event_name == 'pull_request' && format('preview/pr-{0}', github.event.number) || format('ci/main-{0}', github.run_id) }}

      - name: Migrate the preview database (owner role, as the production deploy does)
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      - name: Logins for app_runtime and readonly on this branch (random, masked)
        env:
          OWNER_URL: ${{ steps.neon.outputs.db_url }}
          POOLED_URL: ${{ steps.neon.outputs.db_url_pooled }}
        run: node scripts/preview-db-roles.mjs

      - name: Nobody can query the database but the app (no Data API/GraphQL, TLS only, roles without powers)
        env:
          PREVIEW_DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: npx tsx tests/live/db-exposure.ts

      - name: Deploy preview (connects as app_runtime; admin reports as readonly)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@66.5.0 pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes vercel@66.5.0 build --token="$VERCEL_TOKEN"
          url=$(npx --yes vercel@66.5.0 deploy --prebuilt --token="$VERCEL_TOKEN" \
            --env DATABASE_URL="$RUNTIME_DATABASE_URL_POOLED" \
            --env DATABASE_URL_READONLY="$READONLY_DATABASE_URL_POOLED" \
            --env ADMIN_EMAILS=admin@ci.nightshift.test \
            --env SYBIL_CHECKER_RULES=report)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: No secrets or source maps in the deployed build (values from vercel pull and this job)
        run: node scripts/scan-bundle.mjs --env-file .vercel/.env.preview.local .vercel/output/static .next/static .next/server/app

      - name: Security headers and smoke test on the preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node scripts/check-headers.mjs "$PREVIEW_URL"
          node scripts/smoke.mjs "$PREVIEW_URL"

      # Runs here because it needs this run's preview database (to create
      # the test owner and buyer sessions), which can't be passed to another job.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11" }
      - name: Agent against the preview (real batch-embedding fragment, buyer downloads the result)
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PREVIEW_DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_AUTH_FILE: ${{ runner.temp }}/e2e-auth.json
        run: |
          python -m pip install --quiet --require-hashes -r agent/requirements.lock
          python -m pip install --quiet --no-deps ./agent
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          npx tsx tests/live/agent-preview.ts

      # Signed in as the owner, buyer and admin from the step above, whose job
      # really ran. No report upload: traces would hold the (1-hour) sessions.
      - name: Signed-in dashboards in a real browser (buyer, owner, admin with an authenticator)
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          E2E_AUTH_FILE: ${{ runner.temp }}/e2e-auth.json
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/dashboard.spec.ts --project=chromium
          rm -f "$E2E_AUTH_FILE"

  e2e:
    name: 6 · E2E against preview
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Playwright (Chromium, Firefox, WebKit, mobile)
        if: hashFiles('playwright.config.ts') != ''
        env:
          E2E_BASE_URL: ${{ needs.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          npx playwright install --with-deps
          npm run test:e2e

  zap:
    name: 7 · OWASP ZAP full scan (active)
    needs: [preview, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Active attacks go to this run's preview and its own Neon branch only.
      - name: Target is this run's preview deployment and its own Neon branch (never production)
        env:
          TARGET: ${{ needs.preview.outputs.url }}
          BRANCH: ${{ needs.preview.outputs.neon_branch }}
          BRANCH_ID: ${{ needs.preview.outputs.neon_branch_id }}
        run: |
          host=$(node -e 'process.stdout.write(new URL(process.env.TARGET).hostname)')
          echo "ZAP target: https://$host (a per-deployment preview URL from vercel deploy without --prod)"
          echo "Its database: Neon branch '$BRANCH' ($BRANCH_ID), created for this run from production's schema; production uses the main branch"
          case "$host" in
            nightshift-ten-iota.vercel.app|*nightshift.in) echo "refusing: that is production"; exit 1 ;;
            nightshift-*-inrvishals-projects.vercel.app) ;;
            *) echo "refusing: not a preview deployment URL"; exit 1 ;;
          esac
          case "$BRANCH" in
            preview/pr-*|ci/main-*) ;;
            *) echo "refusing: not a per-PR or per-run Neon branch"; exit 1 ;;
          esac
      # Run directly (digest-pinned image) rather than through the action, so
      # .zap/rules.tsv is really applied (-c; the action dropped it) and no
      # report is uploaded (the repo is public); a summary goes to the log.
      - name: ZAP full scan (spider + AJAX spider + active attacks), rules from .zap/rules.tsv
        env:
          TARGET: ${{ needs.preview.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
        run: |
          mkdir -p zap && cp .zap/rules.tsv zap/rules.tsv && chmod -R a+rwX zap
          # -c: rule levels; -I: WARNs don't fail, FAILs do; -a: alpha rules too;
          # -j: AJAX spider; -m 5: spider for up to 5 minutes.
          set +e
          docker run --rm --network=host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" zap-full-scan.py \
            -t "$TARGET" -c rules.tsv -J report.json -a -j -I -m 5 \
            -z "-config replacer.full_list(0).description=bypass -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=x-vercel-protection-bypass -config replacer.full_list(0).replacement=$BYPASS"
          code=$?
          set -e
          node scripts/zap-summary.mjs zap/report.json
          rm -rf zap
          echo "zap-full-scan exit code: $code (0 = no FAIL rule fired)"
          exit "$code"

  lighthouse:
    name: 8 · Lighthouse (90+ on every category)
    needs: [preview, zap]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Lighthouse CI
        env:
          LHCI_BASE_URL: ${{ needs.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx --yes @lhci/cli@0.16.1 autorun --config=lighthouserc.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: lighthouse, path: lhci_reports/, retention-days: 14 }

  production:
    name: Production deploy + smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lighthouse, load, canary-classifier]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # GitHub environment holding production-only secrets. Add required
    # reviewers to it in repo settings if you want a manual approval gate.
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci

      # The only place the owner (migrator) role's password is used.
      - name: Migrate production (see DEPLOY.md for rollback)
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL_UNPOOLED }}

      - name: Build and deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@66.5.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@66.5.0 build --prod --token="$VERCEL_TOKEN"
          node scripts/scan-bundle.mjs --env-file .vercel/.env.production.local .vercel/output/static .next/static .next/server/app
          npx --yes vercel@66.5.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Security headers and smoke test on production (read-only)
        env:
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: |
          node scripts/check-headers.mjs "$PROD_BASE_URL"
          node scripts/smoke.mjs "$PROD_BASE_URL"

      - name: Lighthouse on production (includes the SEO crawlability audit)
        env:
          LHCI_BASE_URL: ${{ secrets.PROD_BASE_URL }}
          LHCI_PRODUCTION: "1"
        run: npx --yes @lhci/cli@0.16.1 autorun --config=lighthouserc.cjs

  cleanup-main-branch:
    name: Delete the main-run Neon branch
    if: always() && github.event_name == 'push'
    needs: [preview, e2e, zap, lighthouse, production]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ci/main-${{ github.run_id }}
