version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    ignore:
      # Types must match the Node version we run (22). Bump with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch updates arrive as one PR. Major updates (TypeScript,
      # ESLint, Next.js...) stay separate so each gets its own review and CI run.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /agent
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
